<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" width="960" height="620" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff1f2"/>
      <stop offset="0.5" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#f0fdf4"/>
    </linearGradient>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4f46e5"/>
    </marker>
  </defs>
  <rect width="960" height="620" rx="24" fill="url(#bg)"/>
  <text x="40" y="52" font-size="26" font-weight="800" fill="#0f172a">사고관의 전환 — "정답 찾기"에서 "프로세스 설계"로</text>
  <text x="40" y="80" font-size="15" fill="#475569">IB 2년 뒤 가장 크게 바뀌는 것은 점수보다 생각하는 순서입니다</text>

  <!-- column headers -->
  <rect x="40" y="104" width="360" height="52" rx="14" fill="#dc2626"/>
  <text x="220" y="137" text-anchor="middle" font-size="18" font-weight="800" fill="#fff">BEFORE · 결과 중심</text>
  <rect x="560" y="104" width="360" height="52" rx="14" fill="#16a34a"/>
  <text x="740" y="137" text-anchor="middle" font-size="18" font-weight="800" fill="#fff">AFTER · 프로세스 중심</text>

  <!-- middle arrow -->
  <rect x="424" y="250" width="112" height="140" rx="56" fill="#eef2ff" stroke="#c7d2fe" stroke-width="2"/>
  <text x="480" y="300" text-anchor="middle" font-size="22" font-weight="800" fill="#4338ca">IB</text>
  <text x="480" y="326" text-anchor="middle" font-size="16" font-weight="700" fill="#4338ca">2년</text>
  <line x1="440" y1="356" x2="522" y2="356" stroke="#4f46e5" stroke-width="4" marker-end="url(#ar)"/>

  <g font-size="14">
    <!-- rows -->
    <g transform="translate(0,172)">
      <rect x="40" y="0" width="360" height="56" rx="12" fill="#ffffff" stroke="#fecaca"/>
      <text x="60" y="34" fill="#991b1b" font-weight="700">주어진 문제 → "정답이 뭐지?"</text>
      <rect x="560" y="0" width="360" height="56" rx="12" fill="#ffffff" stroke="#bbf7d0"/>
      <text x="580" y="34" fill="#166534" font-weight="700">"어떤 질문을 던질까?" — 내가 만든 질문</text>
    </g>
    <g transform="translate(0,240)">
      <rect x="40" y="0" width="360" height="56" rx="12" fill="#ffffff" stroke="#fecaca"/>
      <text x="60" y="34" fill="#991b1b" font-weight="700">외우고 빨리 푼다</text>
      <rect x="560" y="0" width="360" height="56" rx="12" fill="#ffffff" stroke="#bbf7d0"/>
      <text x="580" y="34" fill="#166534" font-weight="700">어떤 근거·방법으로 검증할까?</text>
    </g>
    <g transform="translate(0,308)">
      <rect x="40" y="0" width="360" height="56" rx="12" fill="#ffffff" stroke="#fecaca"/>
      <text x="60" y="34" fill="#991b1b" font-weight="700">틀리면 감점 — 실패는 끝</text>
      <rect x="560" y="0" width="360" height="56" rx="12" fill="#ffffff" stroke="#bbf7d0"/>
      <text x="580" y="34" fill="#166534" font-weight="700">반론과 한계는? — 실패는 다음 초안의 재료</text>
    </g>
    <g transform="translate(0,376)">
      <rect x="40" y="0" width="360" height="56" rx="12" fill="#ffffff" stroke="#fecaca"/>
      <text x="60" y="34" fill="#991b1b" font-weight="700">AI에게 답을 받아 적는다</text>
      <rect x="560" y="0" width="360" height="56" rx="12" fill="#ffffff" stroke="#bbf7d0"/>
      <text x="580" y="34" fill="#166534" font-weight="700">AI는 조사·반론 점검용, 논증은 직접</text>
    </g>
  </g>

  <!-- 세특 example -->
  <rect x="40" y="456" width="880" height="136" rx="18" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="64" y="488" font-size="16" font-weight="800" fill="#0f172a">생기부 세특에는 이렇게 남습니다</text>
  <rect x="64" y="502" width="380" height="72" rx="12" fill="#fef2f2"/>
  <text x="80" y="530" font-size="13" fill="#991b1b" font-weight="700">일반 기록</text>
  <text x="80" y="554" font-size="14" fill="#7f1d1d">"~에 대해 이해하고 발표를 잘함"</text>
  <rect x="460" y="502" width="436" height="72" rx="12" fill="#f0fdf4"/>
  <text x="476" y="530" font-size="13" fill="#166534" font-weight="700">IB·KB형 기록 = 질문 → 방법 → 한계 → 수정</text>
  <text x="476" y="554" font-size="14" fill="#14532d">"~라는 질문을 세워 ~로 검증, ~ 한계를 발견해 수정함"</text>
</svg>
