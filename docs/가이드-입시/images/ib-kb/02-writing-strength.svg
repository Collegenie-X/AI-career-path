<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#fefce8"/>
    </linearGradient>
  </defs>
  <rect width="960" height="640" rx="24" fill="url(#bg)"/>
  <text x="40" y="52" font-size="26" font-weight="800" fill="#0f172a">왜 IB 학생은 논·서술형에 강한가</text>
  <text x="40" y="80" font-size="15" fill="#475569">객관식 0% · 2년 동안 "쓰고 → 피드백 받고 → 고쳐 쓰는" 양 자체가 다릅니다</text>

  <!-- LEFT: volume comparison -->
  <rect x="40" y="104" width="420" height="500" rx="18" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="64" y="140" font-size="17" font-weight="800" fill="#0f172a">① 가장 긴 글 (한국어 환산)</text>
  <text x="64" y="176" font-size="13" fill="#64748b">일반고 수행평가</text>
  <rect x="64" y="184" width="370" height="22" rx="11" fill="#f1f5f9"/>
  <rect x="64" y="184" width="100" height="22" rx="11" fill="#94a3b8"/>
  <text x="174" y="200" font-size="13" font-weight="700" fill="#475569">약 3,000자</text>
  <text x="64" y="232" font-size="13" fill="#64748b">IB DP 확장 에세이 (EE 4,000단어)</text>
  <rect x="64" y="240" width="370" height="22" rx="11" fill="#f1f5f9"/>
  <rect x="64" y="240" width="370" height="22" rx="11" fill="#ca8a04"/>
  <text x="424" y="256" font-size="13" font-weight="800" fill="#ffffff" text-anchor="end">1만 자 이상</text>

  <text x="64" y="304" font-size="17" font-weight="800" fill="#0f172a">② 2년간 필수 장문 과제</text>
  <g font-size="13" fill="#334155">
    <text x="64" y="338">IA 내부평가</text>
    <g fill="#2563eb">
      <rect x="170" y="324" width="28" height="20" rx="5"/><rect x="204" y="324" width="28" height="20" rx="5"/><rect x="238" y="324" width="28" height="20" rx="5"/>
      <rect x="272" y="324" width="28" height="20" rx="5"/><rect x="306" y="324" width="28" height="20" rx="5"/><rect x="340" y="324" width="28" height="20" rx="5"/>
    </g>
    <text x="378" y="338" font-weight="700" fill="#2563eb">6편</text>
    <text x="64" y="374">EE 소논문</text>
    <rect x="170" y="360" width="96" height="20" rx="5" fill="#ca8a04"/>
    <text x="276" y="374" font-weight="700" fill="#ca8a04">1편 (12~18개월)</text>
    <text x="64" y="410">TOK</text>
    <rect x="170" y="396" width="28" height="20" rx="5" fill="#9333ea"/>
    <rect x="204" y="396" width="28" height="20" rx="5" fill="#9333ea"/>
    <text x="242" y="410" font-weight="700" fill="#9333ea">전시 + 에세이</text>
    <text x="64" y="446">과목 에세이</text>
    <g fill="#16a34a">
      <circle cx="178" cy="442" r="7"/><circle cx="198" cy="442" r="7"/><circle cx="218" cy="442" r="7"/><circle cx="238" cy="442" r="7"/><circle cx="258" cy="442" r="7"/><circle cx="278" cy="442" r="7"/><circle cx="298" cy="442" r="7"/><circle cx="318" cy="442" r="7"/>
    </g>
    <text x="334" y="446" font-weight="700" fill="#16a34a">수십 편</text>
    <text x="64" y="482">구술 평가</text>
    <rect x="170" y="468" width="200" height="20" rx="10" fill="#fee2e2"/>
    <text x="270" y="482" text-anchor="middle" font-weight="700" fill="#b91c1c">언어 구술 · TOK · EE 면담</text>
  </g>
  <rect x="64" y="512" width="370" height="70" rx="12" fill="#fef9c3"/>
  <text x="80" y="540" font-size="14" font-weight="800" fill="#854d0e">4,000단어를 1년 넘게 다듬은 학생에게</text>
  <text x="80" y="564" font-size="14" font-weight="800" fill="#854d0e">1,000자 서술형은 "짧은 글"입니다.</text>

  <!-- RIGHT: 5 mechanisms -->
  <text x="490" y="140" font-size="17" font-weight="800" fill="#0f172a">강해지는 5가지 메커니즘</text>
  <g font-size="14">
    <g transform="translate(490,158)">
      <rect width="430" height="76" rx="14" fill="#ffffff" stroke="#bfdbfe" stroke-width="2"/>
      <circle cx="36" cy="38" r="20" fill="#2563eb"/><text x="36" y="44" text-anchor="middle" fill="#fff" font-weight="800">1</text>
      <text x="68" y="32" font-weight="800" fill="#1d4ed8">루브릭 내면화</text>
      <text x="68" y="56" font-size="13" fill="#475569">채점 기준표를 보고 쓰는 습관 → 채점자의 눈으로 답안 설계</text>
    </g>
    <g transform="translate(490,246)">
      <rect width="430" height="76" rx="14" fill="#ffffff" stroke="#a5f3fc" stroke-width="2"/>
      <circle cx="36" cy="38" r="20" fill="#0891b2"/><text x="36" y="44" text-anchor="middle" fill="#fff" font-weight="800">2</text>
      <text x="68" y="32" font-weight="800" fill="#0e7490">명령어(Command Term) 훈련</text>
      <text x="68" y="56" font-size="13" fill="#475569">설명하라 · 평가하라 · 논하라 → 요구 수준을 정확히 읽음</text>
    </g>
    <g transform="translate(490,334)">
      <rect width="430" height="76" rx="14" fill="#ffffff" stroke="#bbf7d0" stroke-width="2"/>
      <circle cx="36" cy="38" r="20" fill="#16a34a"/><text x="36" y="44" text-anchor="middle" fill="#fff" font-weight="800">3</text>
      <text x="68" y="32" font-weight="800" fill="#15803d">반론 의무화</text>
      <text x="68" y="56" font-size="13" fill="#475569">반대 관점을 다루지 않으면 상위 점수 불가</text>
    </g>
    <g transform="translate(490,422)">
      <rect width="430" height="76" rx="14" fill="#ffffff" stroke="#fde68a" stroke-width="2"/>
      <circle cx="36" cy="38" r="20" fill="#ca8a04"/><text x="36" y="44" text-anchor="middle" fill="#fff" font-weight="800">4</text>
      <text x="68" y="32" font-weight="800" fill="#a16207">분량 체력</text>
      <text x="68" y="56" font-size="13" fill="#475569">장기 논문 경험 → 긴 서술형에서도 구조가 무너지지 않음</text>
    </g>
    <g transform="translate(490,510)">
      <rect width="430" height="76" rx="14" fill="#ffffff" stroke="#e9d5ff" stroke-width="2"/>
      <circle cx="36" cy="38" r="20" fill="#9333ea"/><text x="36" y="44" text-anchor="middle" fill="#fff" font-weight="800">5</text>
      <text x="68" y="32" font-weight="800" fill="#7e22ce">과정 증빙 (AI 대필 차단)</text>
      <text x="68" y="56" font-size="13" fill="#475569">초안 · 성찰 기록 · 구술 면담 → 진짜 쓰기 실력이 쌓임</text>
    </g>
  </g>
</svg>
